name: build-image

# Builds the trex-sc image and pushes it to GitHub Container Registry (GHCR).
# Triggers on every push to main and can be run manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "install_cran.R"
      - "install_github.R"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Heavy Bioconductor images exceed a stock runner's ~14 GB free space;
      # reclaim ~25-30 GB by dropping preinstalled toolchains we don't need.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR image names must be lowercase, so the owner is hardcoded.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bixbeta/trex-sc:1.0
            ghcr.io/bixbeta/trex-sc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
