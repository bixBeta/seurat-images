name: build-image-v6

# Builds the Seurat v6 image and pushes it to GHCR as :v6.

on:
  push:
    branches: [seurat-v6]
    paths:
      - "Dockerfile"
      - "install_seurat.R"
      - "install_rest.R"
      - "install_github.R"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bixbeta/trex-sc:v6
          cache-from: type=registry,ref=ghcr.io/bixbeta/trex-sc:buildcache-v6
          cache-to: type=registry,ref=ghcr.io/bixbeta/trex-sc:buildcache-v6,mode=max
